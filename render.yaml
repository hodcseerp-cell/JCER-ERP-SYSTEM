services:
  - type: web
    name: jcer-erp-backend
    runtime: node
    region: singapore
    rootDir: Admission_process/backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: jcer-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"

databases:
  - name: jcer-erp-db
    databaseName: college_erp_db
    user: erp_user
    region: singapore
    plan: free
