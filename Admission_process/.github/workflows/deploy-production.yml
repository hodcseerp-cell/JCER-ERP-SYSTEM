name: Deploy to Production (Docker KVM 1)

on:
  push:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Build & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            Admission_process/backend/package-lock.json
            Admission_process/frontend/package-lock.json

      - name: Verify Backend Compilation & Type Check
        working-directory: Admission_process/backend
        run: |
          npm ci
          npm run type-check
          npm run build

      - name: Verify Frontend Compilation
        working-directory: Admission_process/frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to KVM 1 Docker Production
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Deployment on KVM 1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.KVM_HOST }}
          username: ${{ secrets.KVM_USER || 'deploy' }}
          key: ${{ secrets.KVM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.KVM_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            echo "============================================================"
            echo "🚀 1. NAVIGATING TO STANDARDIZED PROJECT DIRECTORY"
            echo "============================================================"
            cd /var/www/jcer-erp
            
            echo "============================================================"
            echo "📥 2. PULLING LATEST CODE FROM MAIN"
            echo "============================================================"
            git fetch origin main
            git reset --hard origin/main

            cd /var/www/jcer-erp/Admission_process

            echo "============================================================"
            echo "📦 3. BUILDING DOCKER IMAGES"
            echo "============================================================"
            docker compose build

            echo "============================================================"
            echo "🗄️  4. STARTING DATABASE & CACHE SERVICES"
            echo "============================================================"
            docker compose up -d postgres redis

            echo "============================================================"
            echo "⏳ 5. WAITING UNTIL POSTGRESQL AND REDIS BECOME HEALTHY"
            echo "============================================================"
            for service in postgres redis; do
              echo "Polling health status of service: ${service}..."
              TIMEOUT=60
              ELAPSED=0
              while [ $ELAPSED -lt $TIMEOUT ]; do
                CONTAINER_ID=$(docker compose ps -q "$service" || echo "")
                if [ -n "$CONTAINER_ID" ]; then
                  HEALTH_STATE=$(docker inspect --format='{{json .State.Health.Status}}' "$CONTAINER_ID" 2>/dev/null || echo '"starting"')
                  if [ "$HEALTH_STATE" = '"healthy"' ]; then
                    echo "✅ Service ${service} is HEALTHY!"
                    break
                  fi
                fi
                sleep 2
                ELAPSED=$((ELAPSED + 2))
              done

              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "❌ TIMEOUT: Service ${service} failed to become healthy within ${TIMEOUT}s!"
                docker compose logs --tail=50 "$service"
                exit 1
              fi
            done

            echo "============================================================"
            echo "🔄 6. EXECUTING DATABASE MIGRATIONS (STRICT)"
            echo "============================================================"
            # Migration failures will strictly fail the deployment step
            docker compose run --rm backend npm run migrate

            echo "============================================================"
            echo "🚀 6. STARTING ALL PRODUCTION CONTAINERS"
            echo "============================================================"
            docker compose up -d --remove-orphans

            echo "============================================================"
            echo "🩺 7. PERFORMING POST-DEPLOYMENT HEALTH CHECK"
            echo "============================================================"
            HEALTH_URL="http://127.0.0.1/health"
            MAX_RETRIES=12
            COUNT=0
            SUCCESS=0

            while [ $COUNT -lt $MAX_RETRIES ]; do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "✅ Backend Health check PASSED via Nginx reverse proxy (HTTP $HTTP_STATUS)!"
                SUCCESS=1
                break
              fi
              echo "⏳ Waiting for backend container to become ready... (Attempt $((COUNT+1))/$MAX_RETRIES, status: $HTTP_STATUS)"
              sleep 4
              COUNT=$((COUNT+1))
            done

            if [ $SUCCESS -ne 1 ]; then
              echo "❌ Health check FAILED! Displaying container diagnostic logs:"
              docker compose logs --tail=100 backend
              docker compose logs --tail=50 frontend
              exit 1
            fi

            echo "============================================================"
            echo "🎉 DEPLOYMENT COMPLETED AND VERIFIED SUCCESSFULLY!"
            echo "============================================================"
            docker compose ps