version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: college_erp_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - college-erp-network

  redis:
    image: redis:7-alpine
    container_name: college_erp_redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - college-erp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_erp_backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      REDIS_HOST: redis
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - college-erp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_erp_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - college-erp-network

volumes:
  postgres_data:

networks:
  college-erp-network:
    driver: bridge